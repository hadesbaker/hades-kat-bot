[package]
name = "hades-kat-bot"
version = "0.1.8"
edition = "2021"
authors = ["Taki Hades Baker Alyasri"]
description = "A Solana PumpFun trading/copy bot with PumpPortal integration"
license = "MIT"

[dependencies]
# Solana dependencies
solana-client = "1.18"
solana-sdk = "1.18"
spl-token = "4.0"
# HTTP and async
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
# Logging
log = "0.4"
env_logger = "0.10"
# Time and utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
# Configuration
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
# WebSocket support for real-time data
tokio-tungstenite = "0.20"
# Transaction deserialization
bincode = "1.3"
# Copy trading dependencies
dotenvy = "0.15"
libc = "0.2"
solana-transaction-status = "=1.18.26"
